[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "erasure-benchmark"
version = "0.2.0"
description = "TERP-Core and TERP-Loop benchmarks for implementation erasure, resynthesis, and long-horizon agent maintenance."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
erasure-bench = "erasure_bench.cli:main"

[tool.setuptools.packages.find]
include = ["erasure_bench*"]
